apiVersion: 1

datasources:
  - name: MomentumPostgres
    uid: momentum_postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: momentum
    user: postgres
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: postgres